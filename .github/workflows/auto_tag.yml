name: 🏷️ Auto Tag Release

on:
  push:
    branches:
      - main

jobs:
  create-tag:
    name: Create Git Tag from Pubspec
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: ⬇️ Checkout Repository
        uses: actions/checkout@v4

      - name: 📖 Extract Version from pubspec.yaml
        id: get_version
        run: |
          VERSION=$(grep '^version: ' pubspec.yaml | cut -d ' ' -f 2 | cut -d '+' -f 1)
          echo "App version is $VERSION"
          echo "VERSION=v$VERSION" >> $GITHUB_OUTPUT

      - name: 🚨 Validate Tag Existence
        run: |
          TAG=${{ steps.get_version.outputs.VERSION }}
          # Interroga il server di GitHub per vedere se la reference del tag esiste già
          if git ls-remote --tags origin refs/tags/$TAG | grep -q $TAG; then
            # Sintassi speciale di GitHub Actions per evidenziare l'errore in rosso nella UI
            echo "::error title=Versione Duplicata::❌ Il tag $TAG esiste già! Hai dimenticato di aggiornare la versione nel pubspec.yaml prima del merge."
            exit 1 # Fa fallire istantaneamente l'intera pipeline
          else
            echo "✅ Il tag $TAG non esiste, procedo con la creazione."
          fi

      - name: 🏷️ Create and Push Tag
        # Questo step verrà eseguito SOLO se lo step precedente non ha fatto 'exit 1'
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.PAT_TOKEN }}
          custom_tag: ${{ steps.get_version.outputs.VERSION }}
          tag_prefix: ""